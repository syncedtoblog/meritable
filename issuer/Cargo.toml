[package]
name = "issuer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "issuer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
stellar-strkey = "0.0.16"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-ec = "0.5.0"
rand = "0.8"
hex = "0.4"
light-poseidon = "0.4.1"
